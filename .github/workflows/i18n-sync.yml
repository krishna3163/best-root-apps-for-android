name: 🌐 Multilingual README Sync (i18n)

on:
  push:
    branches:
      - main
    paths:
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-i18n:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Synchronize Chinese & Russian READMEs
        run: |
          python3 scripts/i18n_sync.py

      - name: Commit localized READMEs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.zh-CN.md README.ru.md
          if git diff --staged --quiet; then
            echo "No translation differences detected."
          else
            git commit -m "docs(i18n): sync multilingual Chinese and Russian READMEs [skip ci]"
            git push origin main
          fi
