name: Validate README

on:
  push:
    paths:
      - README.md
      - .github/workflows/validate-readme.yml
  pull_request:
    paths:
      - README.md
      - .github/workflows/validate-readme.yml

permissions:
  contents: read

jobs:
  validate:
    name: Check README structure
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

        - name: Validate README
        run: python scripts/readme.py