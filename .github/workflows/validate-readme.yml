name: Validate README

on:
  push:
    branches: [main]
    paths:
      - README.md
      - scripts/readme.py
      - .github/workflows/validate-readme.yml
  pull_request:
    branches: [main]
    paths:
      - README.md
      - scripts/readme.py
      - .github/workflows/validate-readme.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Check README structure
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate README
        run: python scripts/readme.py