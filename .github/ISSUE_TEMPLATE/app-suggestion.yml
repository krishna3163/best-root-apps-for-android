name: Suggest an app
description: Submit a root or Shizuku-compatible Android app for the catalog.
title: "[App suggestion]: "
labels: [app-suggestion]
body:
  - type: input
    id: name
    attributes:
      label: App name
      placeholder: Example App
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Project, F-Droid, or Google Play link
      placeholder: https://github.com/example/app
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Root and module management
        - Privacy and security
        - System management
        - Performance and battery
        - Developer tools
        - Shizuku and no-root
        - Other
    validations:
      required: true
  - type: dropdown
    id: license
    attributes:
      label: License
      options:
        - FOSS
        - Proprietary
        - Unknown
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Short description
      placeholder: What does this app do and what permissions does it need?
    validations:
      required: true